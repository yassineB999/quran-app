services:
  laravel:
    build:
      context: ../../quran-api
      dockerfile: Dockerfile
    container_name: quran_infra_laravel
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-Laravel}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:9080}"
      DB_CONNECTION: mongodb
      DB_HOST: mongo
      DB_PORT: 27017
      DB_DATABASE: "${MONGO_INITDB_DATABASE:-quran_api}"
      DB_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:-quran_admin}"
      DB_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:-change_this_password}"
      PYTHON_API_URL: "${PYTHON_API_URL:-http://quran_ai_service:8000/recognize}"
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-quran_admin}:${MONGO_INITDB_ROOT_PASSWORD:-change_this_password}@mongo:27017/${MONGO_INITDB_DATABASE:-quran_api}?authSource=admin"
    volumes:
      - ../../quran-api:/var/www/html
      - laravel_vendor:/var/www/html/vendor
    command: >
      sh -c "composer install --no-interaction --optimize-autoloader &&
      php artisan config:clear &&
      php artisan serve --host=0.0.0.0 --port=8001"
    ports:
      - "8001:8001"
    networks:
      - apisix_network

  mongo:
    image: mongo:7
    container_name: quran_infra_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-quran_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_this_password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-quran_api}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - apisix_network

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: quran_apisix_etcd
    restart: unless-stopped
    environment:
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_DATA_DIR: /etcd-data
      ALLOW_NONE_AUTHENTICATION: "yes"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - apisix_network

  apisix:
    image: apache/apisix:3.9.1-debian
    container_name: quran_apisix
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      laravel:
        condition: service_started
    volumes:
      - ./apisix/conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "9080:9080"
      - "127.0.0.1:9180:9180"
    networks:
      - apisix_network

  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: quran_apisix_dashboard
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - ./apisix-dashboard/conf/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - apisix_network

  apisix-bootstrap:
    image: curlimages/curl:8.12.1
    container_name: quran_apisix_bootstrap
    restart: "no"
    depends_on:
      - apisix
    volumes:
      - ./scripts/bootstrap-routes.sh:/bootstrap-routes.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-routes.sh"]
    networks:
      - apisix_network

volumes:
  etcd_data:
  laravel_vendor:
  mongo_data:

networks:
  apisix_network:
    driver: bridge
